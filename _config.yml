title: "Lening Li"
tagline: "Researcher · Engineer · MBA Candidate"
description: "Personal website of Lening Li, PhD — researcher in reinforcement learning, robotics, and control systems; Senior Software Engineer at Symbotic; MBA candidate at Carnegie Mellon University."
github_username: leelening
twitter_username: LeeLening
baseurl: ""
url: "https://lening.li"

plugins:
  - jemoji
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll/scholar
  - jekyll-remote-theme
  - jekyll-feed

sass:
  style: compressed

highlighter: rouge

header_pages:
  - index.md
  - research.md
  - publications.md
  - education.md
  - travel.md
  - contact.md

collections:
  research:
    output: true

include:
  - _data

# set the size of the text to 'large' or 'small', default is small
font-size: small

remote_theme: "tareqdandachi/jekyll-shell-theme"

scholar:
  style: apa
  locale: en

  sort_by: year, month
  order: descending

  group_by: none
  group_order: ascending

  source: ./_bibliography
  bibliography: references.bib
  bibliography_template: bib

  replace_strings: true
  join_strings:    true

  use_raw_bibtex_entry: true

  details_dir:    bibliography
  details_layout: bibtex.html
  details_link:   Details

  query: "@*"
