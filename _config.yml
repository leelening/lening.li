# Site
locale                   : "en-US"
title                    : "Lening Li"
title_separator          : "-"
name                     : "Lening Li"
tagline                  : "Researcher · Engineer · MBA Candidate"
description              : "Personal website of Lening Li, PhD — researcher in reinforcement learning, robotics, and control; Robotic Lab Advisor at Harvard University, Senior Software Engineer at Symbotic, and MBA candidate at Carnegie Mellon University."
url                      : "https://lening.li"
baseurl                  : ""
repository               : "leelening/lening.li"
github_username          : leelening
twitter_username         : LeeLening

# Sidebar author profile
author:
  avatar           : "profile.jpg"
  name             : "Dr. Lening Li"
  bio              : "<span class=\"chip\">Reinforcement learning</span><span class=\"chip\">Optimal control</span><span class=\"chip\">Game theory</span><span class=\"chip\">Formal methods</span><span class=\"chip\">Robotics</span>"
  location         : "Science and Engineering Complex, Allston, MA"
  employer         : "Harvard University · Symbotic · CMU Tepper"
  email            : "leningli@outlook.com"
  googlescholar    : "https://scholar.google.com/citations?user=KWUJ10wAAAAJ"
  github           : "leelening"
  linkedin         : "lening-li"

# Visitor map in the sidebar. provider: "clustrmaps" (the old site's counter, so its history
# carries over; plain image, no script) or "mapmyvisitors" (script widget). Empty id hides it.
visitor_map:
  provider : "mapmyvisitors"
  style    : "map"       # "map" (flat widget, auto width) | "image" (static map.png, no script) | "globe" (3-D)
  id       : "93Ge7jHpH5hunv9BfCt5UmZBOQCk1M7nkV-VtjGT-y4"
  site     : "1c81u"     # public stats page: https://mapmyvisitors.com/web/1c81u
  # Colors from the MapMyVisitors customizer (hex, no #)
  land     : "080808"    # cl  continents
  ocean    : "f6f8f7"    # co  ocean / widget background — same as the page background ($paper)
  dot      : "3acc3a"    # cmo visitor dots
  dot_new  : "ff5353"    # cmn recent visitors
  text     : "808080"    # ct  counter text
  width    : "300"       # w   ("a" = auto)
  # Previous counter (ClustrMaps, used on the old site): provider "clustrmaps",
  # id "YKxOfcR9Q7KzszxH8liwU3S7J6NKaq45NNYZmS8IbzQ", site "1bh5y"

# Site settings
og_image                 : "profile.jpg"   # default social-preview image (in /images/)
teaser                   :
breadcrumbs              : false
words_per_minute         : 160
future                   : true
read_more                : "disabled"
atom_feed:
  hide                   : true

# Reading files
include:
  - files
  - files/cv/CV_English.pdf
  - files/cv/cv_Chinese.pdf
exclude:
  - files/cv          # git submodule (leelening/curriculum_vitae); only the two PDFs above are published
  - .bundle
  - .sass-cache
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - Dockerfile
  - docker-compose.yml
  - jekyll-shell-theme.gemspec
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - node_modules
  - vendor
keep_files:
  - .git

# Conversion
markdown: kramdown
highlighter: rouge
excerpt_separator: "\n\n"
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

collections:
  research:
    output: true
    permalink: /research/:path/

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: research
    values:
      layout: single
      author_profile: true
      show_date: false

sass:
  sass_dir: _sass
  style: compressed

timezone: America/New_York

plugins:
  - jemoji
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll/scholar

compress_html:
  clippings: all
  ignore:
    envs: development

# jekyll-scholar
scholar:
  style: apa
  locale: en
  sort_by: year, month
  order: descending
  group_by: none
  group_order: ascending
  source: ./_bibliography
  bibliography: references.bib
  bibliography_template: bib
  replace_strings: true
  join_strings:    true
  details_dir:    bibliography
  details_layout: bibtex.html
  details_link:   Details
  query: "@*"
