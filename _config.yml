# Site
locale                   : "en-US"
title                    : "Lening Li"
title_separator          : "-"
name                     : "Lening Li"
tagline                  : "Researcher · Engineer · MBA Candidate"
description              : "Personal website of Lening Li, PhD — researcher in reinforcement learning, robotics, and control; Research Affiliate at Yale University, Robotic Lab Advisor at Harvard University, and MBA candidate at Carnegie Mellon University."
url                      : "https://lening.li"
baseurl                  : ""
repository               : "leelening/lening.li"
github_username          : leelening
twitter_username         : LeeLening

# Sidebar author profile
author:
  avatar           : "profile.jpg"
  name             : "Dr. Lening Li"
  bio              : "<span class=\"chip\">Robotics</span> <span class=\"chip\">Motion Planning</span> <span class=\"chip\">Reinforcement Learning</span>"
  location         : "Science and Engineering Complex, Allston, MA"
  employer         : "Yale University · Harvard University · CMU Tepper"
  email            : "leningli@outlook.com"
  booking          : "https://calendar.app.google/2WAzksz5mSQYP4T2A"
  googlescholar    : "https://scholar.google.com/citations?user=KWUJ10wAAAAJ"
  github           : "leelening"
  linkedin         : "lening-li"

# Visitor globe in the sidebar (_includes/visitor-globe.html). The globe itself is self-hosted;
# visit counts come from a tiny Cloudflare Worker (free tier) — code and 5-minute setup in
# _cloudflare/visits/README.md. Paste the deployed worker URL here; empty = globe without marks.
visitor_stats_url        : ""
# Previous counters: MapMyVisitors id "93Ge7jHpH5hunv9BfCt5UmZBOQCk1M7nkV-VtjGT-y4" (stats at
# https://mapmyvisitors.com/web/1c81u); before that ClustrMaps id
# "YKxOfcR9Q7KzszxH8liwU3S7J6NKaq45NNYZmS8IbzQ" (https://clustrmaps.com/site/1bh5y).

# Site settings
og_image                 : "profile.jpg"   # default social-preview image (in /images/)
teaser                   :
breadcrumbs              : false
words_per_minute         : 160
future                   : true
read_more                : "disabled"
atom_feed:
  hide                   : true

# Reading files
include:
  - files
  - files/cv/CV_English.pdf
  - files/cv/Resume.pdf
  - files/cv/cv_Chinese.pdf
exclude:
  - files/cv          # git submodule (leelening/curriculum_vitae); only the three PDFs above are published
  - .bundle
  - .sass-cache
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - Dockerfile
  - docker-compose.yml
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - node_modules
  - vendor
keep_files:
  - .git

# Conversion
markdown: kramdown
highlighter: rouge
excerpt_separator: "\n\n"
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

collections:
  research:
    output: true
    permalink: /research/:path/

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: research
    values:
      layout: single
      author_profile: true
      show_date: false

sass:
  sass_dir: _sass
  style: compressed

timezone: America/New_York

plugins:
  - jemoji
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll/scholar

compress_html:
  clippings: all
  ignore:
    envs: development

# jekyll-scholar
scholar:
  style: apa
  locale: en
  sort_by: year, month
  order: descending
  group_by: none
  group_order: ascending
  source: ./_bibliography
  bibliography: references.bib
  bibliography_template: bib
  replace_strings: true
  join_strings:    true
  details_dir:    bibliography
  details_layout: bibtex.html
  details_link:   Details
  query: "@*"
