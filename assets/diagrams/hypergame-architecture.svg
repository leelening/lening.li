<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-labelledby="t d">
  <title id="t">Deceptive planning with dynamic hypergames</title>
  <desc id="d">P1 plans with the true game G1 while P2 acts on its perceived game G2; a game solver, online monitoring, a deceptive planner and subgoal inference form a closed loop through the game transition system.</desc>
  <defs>
    <style>
      text { font-family: 'Iowan Old Style', Palatino, 'Palatino Linotype', 'Book Antiqua', Georgia, serif; fill:#15130f; }
      .box { fill:#fdfcfc; stroke:#4b463d; stroke-width:1.5; }
      .box--accent { fill:#A51C30; stroke:#A51C30; }
      .box--tint { fill:#f6dfe2; stroke:#A51C30; }
      .lbl { font-size:15px; font-weight:700; text-anchor:middle; }
      .lbl--light { fill:#ffffff; }
      .sub { font-size:12.5px; fill:#4b463d; text-anchor:middle; }
      .stage { font-size:11.5px; letter-spacing:.14em; fill:#867f71; text-anchor:middle; text-transform:uppercase; }
      .sym { font-size:16px; font-style:italic; fill:#A51C30; text-anchor:middle; }
      .edge { fill:none; stroke:#4b463d; stroke-width:1.5; marker-end:url(#arrow); }
      .edge--accent { stroke:#A51C30; }
      .note { font-size:12.5px; fill:#4b463d; text-anchor:middle; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b463d"/></marker>
  </defs>
  <rect width="900" height="470" fill="#ffffff"/>

  <!-- stage labels -->
  <text class="stage" x="270" y="52">ω-REGULAR GAME</text><text class="stage" x="270" y="70">SOLUTIONS</text>
  <text class="stage" x="510" y="52">ONLINE MONITORING</text><text class="stage" x="510" y="70">MISMATCH DETECTION</text>
  <text class="stage" x="765" y="52">PROBABILISTIC</text><text class="stage" x="765" y="70">SYNTHESIS</text>

  <!-- row 1 -->
  <rect class="box" x="30" y="120" width="135" height="70" rx="2"/>
  <text class="lbl" x="97" y="150">Game G₂</text>
  <text class="sub" x="97" y="171">perceived by P2</text>

  <polygon class="box box--tint" points="270,105 350,155 270,205 190,155"/>
  <text class="lbl" x="270" y="151">Game</text>
  <text class="sub" x="270" y="170">solver</text>

  <rect class="box" x="430" y="120" width="160" height="70" rx="2"/>
  <text class="lbl" x="510" y="150">Game G₁</text>
  <text class="sub" x="510" y="171">known to P1</text>

  <polygon class="box box--accent" points="765,105 855,155 765,205 675,155"/>
  <text class="lbl lbl--light" x="765" y="151">Deceptive</text>
  <text class="sub lbl--light" x="765" y="170" style="fill:#ffffff">planner</text>

  <!-- row 1 edges -->
  <path class="edge" d="M165,155 L190,155"/>
  <path class="edge" d="M350,155 L430,155"/>
  <text class="sym" x="390" y="147">a₂</text>
  <path class="edge edge--accent" d="M590,155 L675,155"/>
  <path class="edge edge--accent" d="M855,155 L885,155"/>
  <text class="sym" x="870" y="147">a₁</text>

  <!-- row 2 -->
  <rect class="box" x="520" y="300" width="230" height="70" rx="2"/>
  <text class="lbl" x="635" y="330">Game transition system</text>
  <text class="sub" x="635" y="351">state · observation</text>

  <rect class="box" x="160" y="300" width="150" height="70" rx="2"/>
  <text class="lbl" x="235" y="330">Inference</text>
  <text class="sub" x="235" y="351">of P2's perception</text>
  <text class="stage" x="235" y="420">SUBGOAL INFERENCE</text>

  <!-- feedback edges -->
  <path class="edge edge--accent" d="M765,205 L765,260 L635,260 L635,300"/>
  <path class="edge" d="M520,335 L310,335"/>
  <text class="note" x="415" y="326">new observation</text>
  <path class="edge" d="M160,335 L97,335 L97,190"/>
  <path class="edge" d="M510,190 L510,260 L635,260" style="marker-end:none"/>
</svg>
