<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 410" font-family="'Iowan Old Style', Palatino, 'Palatino Linotype', 'Book Antiqua', Georgia, serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#867f71"/>
    </marker>
    <style>
      .pillar { fill:#f7f8f9; stroke:#d3d7dc; stroke-width:1.5; rx:10; }
      .pillar-title { font-size:15px; font-weight:600; fill:#15130f; text-anchor:middle; }
      .pillar-sub { font-size:11px; fill:#4b463d; text-anchor:middle; }
      .core { fill:#7a2e22; rx:12; }
      .core-title { font-size:18px; font-weight:700; fill:#ffffff; text-anchor:middle; }
      .core-sub { font-size:12px; fill:#f1dcd6; text-anchor:middle; }
      .app { fill:#ffffff; stroke:#7a2e22; stroke-width:1.5; rx:18; }
      .app-t { font-size:13px; font-weight:600; fill:#7a2e22; text-anchor:middle; }
      .flow { stroke:#867f71; stroke-width:1.6; fill:none; marker-end:url(#arr); }
      .label { font-size:11px; fill:#867f71; text-anchor:middle; letter-spacing:.12em; }
    </style>
  </defs>

  <text x="480" y="22" class="label">FOUNDATIONS</text>

  <rect x="30"  y="36" width="210" height="76" class="pillar"/>
  <text x="135" y="68" class="pillar-title">Reinforcement Learning</text>
  <text x="135" y="92" class="pillar-sub">model-free · approximate DP</text>

  <rect x="260" y="36" width="210" height="76" class="pillar"/>
  <text x="365" y="68" class="pillar-title">Optimal Control</text>
  <text x="365" y="92" class="pillar-sub">stochastic · chance-constrained</text>

  <rect x="490" y="36" width="210" height="76" class="pillar"/>
  <text x="595" y="68" class="pillar-title">Game Theory</text>
  <text x="595" y="92" class="pillar-sub">hypergames · hidden information</text>

  <rect x="720" y="36" width="210" height="76" class="pillar"/>
  <text x="825" y="68" class="pillar-title">Formal Methods</text>
  <text x="825" y="92" class="pillar-sub">temporal logic · automata</text>

  <path d="M135,112 C135,155 300,150 385,176" class="flow"/>
  <path d="M365,112 C365,145 410,150 440,176" class="flow"/>
  <path d="M595,112 C595,145 550,150 520,176" class="flow"/>
  <path d="M825,112 C825,155 660,150 575,176" class="flow"/>

  <rect x="240" y="178" width="480" height="104" class="core"/>
  <text x="480" y="212" class="core-title">Provably-correct planning &amp; control</text>
  <text x="480" y="236" class="core-title">for autonomous robots</text>
  <text x="480" y="264" class="core-sub">high-level specifications → policies with formal guarantees</text>

  <path d="M360,282 C360,305 240,300 195,326" class="flow"/>
  <path d="M480,282 L480,326" class="flow"/>
  <path d="M600,282 C600,305 720,300 765,326" class="flow"/>

  <rect x="60"  y="330" width="270" height="40" class="app"/>
  <text x="195" y="355" class="app-t">Warehouse robot fleets</text>

  <rect x="345" y="330" width="270" height="40" class="app"/>
  <text x="480" y="355" class="app-t">Humanoid &amp; mobile robots</text>

  <rect x="630" y="330" width="270" height="40" class="app"/>
  <text x="765" y="355" class="app-t">Cyber-physical security</text>

  <text x="480" y="400" class="label">APPLICATIONS</text>
</svg>
