<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" font-family="'Iowan Old Style', Palatino, 'Palatino Linotype', 'Book Antiqua', Georgia, serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#867f71"/>
    </marker>
    <style>
      .box { fill:#f7f8f9; stroke:#d3d7dc; stroke-width:1.5; rx:10; }
      .hi  { fill:#7a2e22; stroke:none; }
      .t   { font-size:14px; font-weight:600; fill:#15130f; text-anchor:middle; }
      .s   { font-size:11px; fill:#4b463d; text-anchor:middle; }
      .t.w { fill:#fff; } .s.w { fill:#f1dcd6; }
      .step { font-size:10.5px; fill:#a9a294; text-anchor:middle; letter-spacing:.12em; }
      .f { stroke:#867f71; stroke-width:1.6; marker-end:url(#a); }
      .g { font-size:12px; fill:#7a2e22; text-anchor:middle; font-style:italic; }
    </style>
  </defs>

  <text x="99"  y="44" class="step">SPECIFY</text>
  <text x="297" y="44" class="step">TRANSLATE</text>
  <text x="495" y="44" class="step">COMPOSE</text>
  <text x="693" y="44" class="step">SOLVE</text>
  <text x="891" y="44" class="step">DEPLOY</text>

  <rect x="10"  y="58" width="178" height="80" class="box"/>
  <text x="99"  y="92" class="t">Temporal-logic task</text>
  <text x="99"  y="114" class="s">PCTL / scLTL formula φ</text>

  <rect x="208" y="58" width="178" height="80" class="box"/>
  <text x="297" y="92" class="t">Task automaton</text>
  <text x="297" y="114" class="s">DFA · topological order</text>

  <rect x="406" y="58" width="178" height="80" class="box"/>
  <text x="495" y="92" class="t">Product model</text>
  <text x="495" y="114" class="s">dynamics × automaton</text>

  <rect x="604" y="58" width="178" height="80" class="box hi"/>
  <text x="693" y="92" class="t w">Topological ADP</text>
  <text x="693" y="114" class="s w">reverse-causal value iteration</text>

  <rect x="802" y="58" width="178" height="80" class="box"/>
  <text x="891" y="92" class="t">Feedback policy</text>
  <text x="891" y="114" class="s">Pr(φ satisfied) ≥ 1 − δ</text>

  <line x1="188" y1="98" x2="206" y2="98" class="f"/>
  <line x1="386" y1="98" x2="404" y2="98" class="f"/>
  <line x1="584" y1="98" x2="602" y2="98" class="f"/>
  <line x1="782" y1="98" x2="800" y2="98" class="f"/>

  <text x="495" y="186" class="g">Run time grows with the number of automaton states — not exponentially with the specification.</text>
</svg>
