{% include base_path %}

<!-- start custom head snippets -->
<link rel="apple-touch-icon" sizes="180x180" href="{{ base_path }}/images/apple-touch-icon-180x180.png">
<link rel="icon" type="image/svg+xml" href="{{ base_path }}/images/favicon.svg">
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-32x32.png" sizes="32x32">
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-16x16.png" sizes="16x16">
<meta name="theme-color" content="#f6f8f7">
<link rel="stylesheet" href="{{ base_path }}/assets/css/academicons.css"/>
<link rel="preload" href="{{ base_path }}/assets/fonts/text/source-serif-4-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="{{ base_path }}/assets/fonts/text/inter-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>

<!-- end custom head snippets -->
<script>
document.addEventListener('click', function (e) {
  var tgl = e.target.closest('#site-nav > button, .author__urls-wrapper > button');
  if (tgl) { setTimeout(function () {
    var panel = document.getElementById(tgl.getAttribute('aria-controls'));
    if (panel) tgl.setAttribute('aria-expanded', panel.classList.contains('hidden') || getComputedStyle(panel).display === 'none' ? 'false' : 'true');
  }, 250); }
  var btn = e.target.closest('.bib-copy'); if (!btn) return;
  var pre = btn.parentNode.querySelector('pre'); if (!pre) return;
  var text = pre.textContent;
  function done(ok) { btn.textContent = ok ? 'Copied' : 'Press Ctrl+C'; btn.classList.add('is-done'); setTimeout(function () { btn.textContent = 'Copy'; btn.classList.remove('is-done'); }, 1600); }
  if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(text).then(function () { done(true); }, function () { done(false); }); }
  else { var r = document.createRange(); r.selectNodeContents(pre); var s = window.getSelection(); s.removeAllRanges(); s.addRange(r); try { done(document.execCommand('copy')); } catch (err) { done(false); } }
});
</script>
