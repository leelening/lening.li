<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="'Iowan Old Style', Palatino, 'Palatino Linotype', 'Book Antiqua', Georgia, serif">
  <defs>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4b463d"/></marker>
    <style>
      .st { fill:#fff; stroke:#15130f; stroke-width:2.5; }
      .acc { fill:#f1dcd6; stroke:#7a2e22; }
      .lbl { font-size:22px; fill:#15130f; text-anchor:middle; font-weight:600; }
      .edge { stroke:#4b463d; stroke-width:2.2; fill:none; marker-end:url(#m); }
      .el { font-size:18px; fill:#4b463d; text-anchor:middle; font-style:italic; }
      .cap { font-size:16px; fill:#867f71; letter-spacing:.12em; }
      .grid { stroke:#e6e9ec; stroke-width:1; }
    </style>
  </defs>
  <rect width="800" height="450" fill="#f7f8f9"/>

  <!-- grid world (right) -->
  <g transform="translate(470,70)">
    <rect x="0" y="0" width="280" height="280" fill="#fff" stroke="#d3d7dc" stroke-width="1.5"/>
    <g class="grid">
      <line x1="70" y1="0" x2="70" y2="280"/><line x1="140" y1="0" x2="140" y2="280"/><line x1="210" y1="0" x2="210" y2="280"/>
      <line x1="0" y1="70" x2="280" y2="70"/><line x1="0" y1="140" x2="280" y2="140"/><line x1="0" y1="210" x2="280" y2="210"/>
    </g>
    <rect x="140" y="70" width="70" height="70" fill="#fecaca"/>
    <rect x="70" y="210" width="70" height="70" fill="#fecaca"/>
    <text x="175" y="112" class="el" font-style="normal" fill="#b91c1c">c</text>
    <text x="105" y="252" class="el" font-style="normal" fill="#b91c1c">c</text>
    <rect x="0" y="140" width="70" height="70" fill="#dbeafe"/><text x="14" y="202" class="el" font-style="normal" fill="#1d4ed8" text-anchor="start">a</text>
    <rect x="210" y="210" width="70" height="70" fill="#f1dcd6"/><text x="266" y="272" class="el" font-style="normal" fill="#7a2e22" text-anchor="end">b</text>
    <!-- trajectory -->
    <path d="M35,35 L35,175 L245,175 L245,245" fill="none" stroke="#7a2e22" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1 0"/>
    <circle cx="35" cy="35" r="9" fill="#7a2e22"/>
    <circle cx="245" cy="245" r="9" fill="#7a2e22"/>
  </g>

  <!-- automaton (left) -->
  <circle cx="90"  cy="210" r="34" class="st"/>
  <circle cx="230" cy="210" r="34" class="st"/>
  <circle cx="370" cy="210" r="34" class="acc st"/>
  <circle cx="370" cy="210" r="27" fill="none" stroke="#7a2e22" stroke-width="2"/>
  <text x="90"  y="218" class="lbl">q₀</text>
  <text x="230" y="218" class="lbl">q₁</text>
  <text x="370" y="218" class="lbl" fill="#7a2e22">q₂</text>
  <line x1="124" y1="210" x2="194" y2="210" class="edge"/>
  <line x1="264" y1="210" x2="334" y2="210" class="edge"/>
  <text x="159" y="196" class="el">a ∧ ¬c</text>
  <text x="299" y="196" class="el">b ∧ ¬c</text>
  <path d="M75,178 C55,130 125,130 105,178" class="edge"/>
  <path d="M215,178 C195,130 265,130 245,178" class="edge"/>
  <text x="90"  y="126" class="el">¬a ∧ ¬c</text>
  <text x="230" y="126" class="el">¬b ∧ ¬c</text>
  <line x1="20" y1="210" x2="54" y2="210" class="edge"/>

  <text x="40" y="300" class="cap">φ = ◇(a ∧ ◇b) ∧ □¬c</text>
  <text x="40" y="330" font-size="15" fill="#7a2e22" font-weight="600">Pr(σ ⊨ φ) ≥ 1 − δ</text>
  <text x="40" y="400" class="cap">SPEC  →  AUTOMATON  →  POLICY</text>
</svg>
