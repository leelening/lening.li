<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="'Iowan Old Style', Palatino, 'Palatino Linotype', 'Book Antiqua', Georgia, serif">
  <defs>
    <style>
      .slot { fill:#fff; stroke:#15130f; stroke-width:2.5; }
      .pick { fill:#f6dfe2; stroke:#A51C30; }
      .lbl { font-size:22px; fill:#15130f; text-anchor:middle; font-weight:600; }
      .el { font-size:18px; fill:#4b463d; text-anchor:middle; font-style:italic; }
      .eq { fill:#4b463d; text-anchor:start; font-style:italic; }
      .cap { font-size:16px; fill:#867f71; letter-spacing:.12em; }
      .bar { fill:#d3d7dc; }
      .barpick { fill:#A51C30; }
    </style>
  </defs>
  <rect width="800" height="450" fill="#f7f8f9"/>

  <!-- objective (left) -->
  <g transform="translate(60,70)">
    <text x="0" y="0" class="cap">OBJECTIVE</text>
    <text x="0" y="46" class="eq" font-size="26">max Σ pᵢ xᵢ</text>
    <text x="0" y="96" class="cap">SUBJECT TO</text>
    <text x="0" y="140" class="eq" font-size="22">Σ sᵢ xᵢ ≤ 50,000</text>
    <text x="0" y="176" class="eq" font-size="22">one player per slot</text>
    <text x="0" y="212" class="eq" font-size="22">xᵢ ∈ {0, 1}</text>
    <!-- projected-points bars -->
    <g transform="translate(0,250)">
      <rect class="bar" x="0" y="0" width="40" height="70"/><rect class="barpick" x="50" y="20" width="40" height="50"/>
      <rect class="bar" x="100" y="35" width="40" height="35"/><rect class="barpick" x="150" y="10" width="40" height="60"/>
      <rect class="bar" x="200" y="45" width="40" height="25"/><rect class="barpick" x="250" y="25" width="40" height="45"/>
      <line x1="0" y1="71" x2="300" y2="71" stroke="#4b463d" stroke-width="2"/>
      <text x="150" y="100" class="cap" text-anchor="middle">PROJECTED FPPG · SALARY</text>
    </g>
  </g>

  <!-- lineup card (right) -->
  <g transform="translate(450,60)">
    <rect x="0" y="0" width="300" height="330" fill="#fff" stroke="#d3d7dc" stroke-width="1.5"/>
    <text x="150" y="36" class="lbl">Optimal lineup</text>
    <line x1="20" y1="52" x2="280" y2="52" stroke="#e6e9ec"/>
    <g class="el" font-style="normal" font-size="19">
      <text x="45" y="86">PG</text><text x="45" y="120">SG</text><text x="45" y="154">SF</text><text x="45" y="188">PF</text>
      <text x="45" y="222">C</text><text x="45" y="256">G</text><text x="45" y="290">F</text><text x="45" y="324">UTIL</text>
    </g>
    <g>
      <rect class="slot pick" x="80" y="70" width="190" height="22" rx="3"/>
      <rect class="slot pick" x="80" y="104" width="190" height="22" rx="3"/>
      <rect class="slot pick" x="80" y="138" width="190" height="22" rx="3"/>
      <rect class="slot pick" x="80" y="172" width="190" height="22" rx="3"/>
      <rect class="slot pick" x="80" y="206" width="190" height="22" rx="3"/>
      <rect class="slot pick" x="80" y="240" width="190" height="22" rx="3"/>
      <rect class="slot pick" x="80" y="274" width="190" height="22" rx="3"/>
      <rect class="slot pick" x="80" y="308" width="190" height="22" rx="3"/>
    </g>
  </g>
  <text x="600" y="420" class="cap" text-anchor="middle">SOLVED DAILY · GITHUB ACTIONS</text>
</svg>
