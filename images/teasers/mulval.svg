<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="'Iowan Old Style', Palatino, 'Palatino Linotype', 'Book Antiqua', Georgia, serif">
  <defs>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4b463d"/></marker>
    <marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#A51C30"/></marker>
    <style>
      .leaf { fill:#fff; stroke:#15130f; stroke-width:2.5; }
      .and  { fill:#f6dfe2; stroke:#A51C30; stroke-width:2.5; }
      .or   { fill:#e6e9ec; stroke:#4b463d; stroke-width:2.5; }
      .lbl  { font-size:20px; fill:#15130f; text-anchor:middle; font-weight:600; }
      .edge { stroke:#4b463d; stroke-width:2.2; fill:none; marker-end:url(#m); }
      .cap  { font-size:16px; fill:#867f71; letter-spacing:.12em; }
      .code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size:17px; fill:#4b463d; }
      .kw   { fill:#A51C30; font-weight:600; }
    </style>
  </defs>
  <rect width="800" height="450" fill="#f7f8f9"/>

  <!-- attack graph (left) -->
  <text x="60" y="60" class="cap">MULVAL ATTACK GRAPH</text>
  <g transform="translate(40,80)">
    <!-- leaves -->
    <rect class="leaf" x="0" y="20" width="90" height="40" rx="3"/><text x="45" y="47" class="lbl">LEAF</text>
    <rect class="leaf" x="0" y="130" width="90" height="40" rx="3"/><text x="45" y="157" class="lbl">LEAF</text>
    <rect class="leaf" x="0" y="240" width="90" height="40" rx="3"/><text x="45" y="267" class="lbl">LEAF</text>
    <!-- AND rules -->
    <ellipse class="and" cx="175" cy="95" rx="42" ry="26"/><text x="175" y="102" class="lbl">AND</text>
    <ellipse class="and" cx="175" cy="205" rx="42" ry="26"/><text x="175" y="212" class="lbl">AND</text>
    <!-- OR privileges -->
    <path class="or" d="M300,70 l32,25 -32,25 -32,-25 z"/><text x="300" y="102" class="lbl" font-size="16">OR</text>
    <path class="or" d="M300,180 l32,25 -32,25 -32,-25 z"/><text x="300" y="212" class="lbl" font-size="16">OR</text>
    <!-- edges -->
    <path class="edge" d="M90,40 C120,40 120,85 133,90"/>
    <path class="edge" d="M90,150 C120,150 120,105 133,100"/>
    <path class="edge" d="M90,150 C120,150 120,195 133,200"/>
    <path class="edge" d="M90,260 C120,260 120,215 133,210"/>
    <path class="edge" d="M217,95 L268,95"/>
    <path class="edge" d="M217,205 L268,205"/>
    <path class="edge" d="M300,120 C300,150 300,150 300,180"/>
  </g>

  <!-- big arrow -->
  <path d="M400,225 L455,225" stroke="#A51C30" stroke-width="4" fill="none" marker-end="url(#mr)"/>

  <!-- PDDL (right) -->
  <text x="490" y="60" class="cap">PDDL</text>
  <g transform="translate(480,80)">
    <rect x="0" y="0" width="280" height="290" fill="#fff" stroke="#d3d7dc" stroke-width="1.5"/>
    <g class="code">
      <text x="16" y="34">(<tspan class="kw">define</tspan> (domain attack)</text>
      <text x="36" y="66">(<tspan class="kw">:action</tspan> rule-1</text>
      <text x="56" y="94">:precondition (and …)</text>
      <text x="56" y="122">:effect (priv-1)))</text>
      <text x="16" y="170">(<tspan class="kw">define</tspan> (problem net)</text>
      <text x="36" y="202">(<tspan class="kw">:init</tspan> leaf-1 leaf-2 …)</text>
      <text x="36" y="234">(<tspan class="kw">:goal</tspan> (and priv-1</text>
      <text x="150" y="262">priv-2)))</text>
    </g>
  </g>

  <!-- legend -->
  <g class="cap" font-size="14">
    <text x="60" y="415">LEAF → :init</text>
    <text x="220" y="415">AND → :action</text>
    <text x="400" y="415">OR → predicate / :goal</text>
  </g>
</svg>
