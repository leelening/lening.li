<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="'Iowan Old Style', Palatino, 'Palatino Linotype', 'Book Antiqua', Georgia, serif">
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4b463d"/></marker>
    <style>
      .p1 { fill:#fff; stroke:#A51C30; stroke-width:2.5; }
      .p2 { fill:#fff; stroke:#b45309; stroke-width:2.5; }
      .e  { stroke:#4b463d; stroke-width:2; fill:none; marker-end:url(#g); }
      .hid { stroke:#a9a294; stroke-width:2; stroke-dasharray:7 6; fill:none; marker-end:url(#g); }
      .t { font-size:20px; text-anchor:middle; fill:#15130f; font-weight:600; }
      .cap { font-size:16px; fill:#867f71; letter-spacing:.12em; }
      .leg { font-size:16px; fill:#4b463d; }
      .layer { fill:#eef0f2; stroke:#e6e9ec; rx:14; }
    </style>
  </defs>
  <rect width="800" height="450" fill="#f7f8f9"/>

  <!-- perception layers -->
  <rect x="40" y="60" width="720" height="150" class="layer"/>
  <text x="60" y="88" class="cap">P1 — TRUE GAME</text>
  <rect x="40" y="240" width="720" height="150" class="layer"/>
  <text x="60" y="268" class="cap">P2 — PERCEIVED GAME (MISINFORMED)</text>

  <!-- top layer graph -->
  <g>
    <circle cx="140" cy="150" r="24" class="p1"/><text x="140" y="157" class="t">s₀</text>
    <rect x="276" y="126" width="48" height="48" class="p2"/><text x="300" y="157" class="t">s₁</text>
    <circle cx="460" cy="150" r="24" class="p1"/><text x="460" y="157" class="t">s₂</text>
    <rect x="596" y="126" width="48" height="48" class="p2"/><text x="620" y="157" class="t">s₃</text>
    <circle cx="700" cy="150" r="24" fill="#f6dfe2" stroke="#A51C30" stroke-width="2.5"/><text x="700" y="157" class="t" fill="#A51C30">✓</text>
    <line x1="164" y1="150" x2="274" y2="150" class="e"/>
    <line x1="324" y1="150" x2="434" y2="150" class="e"/>
    <line x1="484" y1="150" x2="594" y2="150" class="e"/>
    <line x1="644" y1="150" x2="674" y2="150" class="e"/>
    <path d="M300,126 C340,80 420,80 460,126" class="e"/>
  </g>

  <!-- bottom layer: same graph but the shortcut edge is hidden -->
  <g>
    <circle cx="140" cy="330" r="24" class="p1"/><text x="140" y="337" class="t">s₀</text>
    <rect x="276" y="306" width="48" height="48" class="p2"/><text x="300" y="337" class="t">s₁</text>
    <circle cx="460" cy="330" r="24" class="p1"/><text x="460" y="337" class="t">s₂</text>
    <rect x="596" y="306" width="48" height="48" class="p2"/><text x="620" y="337" class="t">s₃</text>
    <circle cx="700" cy="330" r="24" fill="#fee2e2" stroke="#b91c1c" stroke-width="2.5"/><text x="700" y="337" class="t" fill="#b91c1c">✗</text>
    <line x1="164" y1="330" x2="274" y2="330" class="e"/>
    <line x1="324" y1="330" x2="434" y2="330" class="e"/>
    <line x1="484" y1="330" x2="594" y2="330" class="e"/>
    <line x1="644" y1="330" x2="674" y2="330" class="e"/>
    <path d="M300,306 C340,260 420,260 460,306" class="hid"/>
  </g>

  <!-- legend -->
  <circle cx="60" cy="425" r="9" class="p1"/><text x="78" y="431" class="leg">Robot (P1)</text>
  <rect x="200" y="416" width="18" height="18" class="p2"/><text x="226" y="431" class="leg">Adversary (P2)</text>
  <line x1="390" y1="425" x2="440" y2="425" class="hid"/><text x="452" y="431" class="leg">action hidden from P2</text>
</svg>
